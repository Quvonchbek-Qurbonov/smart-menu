version: '3.8'

services:
  db:
    image: postgres:17
    container_name: database
    environment:
      POSTGRES_USER: application
      POSTGRES_PASSWORD: SmartMenu123.
      POSTGRES_DB: smartmenu
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U application -d smartmenu" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartmenu
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: