<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f7fa;">
    <table style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <tr>
            <td style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px; text-align: center;">
                <h1 style="color: #ffffff; margin: 0; font-size: 24px;">🔐 Verify Your Account</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 40px; text-align: center;">
                <p style="color: #374151; font-size: 16px; margin-bottom: 30px;">
                    Use the code below to verify your account:
                </p>
                <div style="background: #f0f4ff; border: 2px dashed #667eea; border-radius: 12px; padding: 25px; display: inline-block;">
                    <span style="color: #4F46E5; font-size: 36px; font-weight: bold; letter-spacing: 8px; font-family: monospace;">{{OTP}}</span>
                </div>
                <p style="color: #f59e0b; font-size: 14px; margin-top: 25px;">
                    ⏱️ This code expires in <strong>10 minutes</strong>
                </p>
                <p style="color: #9ca3af; font-size: 13px; margin-top: 30px;">
                    If you didn't request this code, please ignore this email.
                </p>
            </td>
        </tr>
        <tr>
            <td style="background-color: #f9fafb; padding: 20px; text-align: center;">
                <p style="color: #9ca3af; font-size: 12px; margin: 0;">© 2025 Smart Menu</p>
            </td>
        </tr>
    </table>
</body>
</html>
